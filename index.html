<title>limper's club</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: faixa amarela da marca no topo com as abas; abaixo, painéis de borda fina em fundo neutro; amarelo só onde há dinheiro ou destaque */
:root{
  --yellow:#ffdc00; --yellow-ink:#111111; --red:#e5141b;
  --bg:#f3f2ec; --surface:#ffffff; --surface-2:#f1f0e9; --line:#e1dfd4; --line-soft:#ecebe3;
  --fg:#121210; --muted:#64625a; --faint:#a3a196;
  --accent:#111111; --mark:#b39a00;
  --pos:#1d8a4e; --neg:#cc2a30;
  --s1:#3a3934; --s2:#6e6c64; --s3:#9a978c; --s4:#c4c1b5; --s5:#dcd9cc;
  --font-ui:"Lexend",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d0d0b; --surface:#161613; --surface-2:#1e1e1a; --line:#2b2a25; --line-soft:#22221e;
  --fg:#f1f0e8; --muted:#9a988d; --faint:#5f5d55;
  --accent:#ffdc00; --mark:#ffdc00;
  --pos:#4cc584; --neg:#f0585d;
  --s1:#e8e6dc; --s2:#b5b3a8; --s3:#86847a; --s4:#5c5a52; --s5:#3d3c36;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d0d0b; --surface:#161613; --surface-2:#1e1e1a; --line:#2b2a25; --line-soft:#22221e;
  --fg:#f1f0e8; --muted:#9a988d; --faint:#5f5d55;
  --accent:#ffdc00; --mark:#ffdc00;
  --pos:#4cc584; --neg:#f0585d;
  --s1:#e8e6dc; --s2:#b5b3a8; --s3:#86847a; --s4:#5c5a52; --s5:#3d3c36;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--yellow)}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:6px}

/* faixa da marca */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--yellow);color:var(--yellow-ink)}
.top-in,.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:20px;height:60px}
.wm{background:none;border:0;padding:0;cursor:pointer;font-family:var(--font-ui);font-weight:800;font-size:26px;letter-spacing:-.045em;line-height:1;white-space:nowrap;display:inline-flex;align-items:baseline;color:var(--yellow-ink)}
.wm i{display:inline-block;width:.26em;height:.26em;border-radius:50%;background:var(--red);margin:0 .03em 0 .05em}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-radius:999px;padding:7px 14px;color:var(--yellow-ink);opacity:.7;cursor:pointer;white-space:nowrap;font-weight:600}
.tab:hover{opacity:1}
.tab[aria-selected="true"]{opacity:1;background:var(--yellow-ink);color:var(--yellow)}
.adm-tab{display:inline-flex;align-items:center;gap:6px;flex:none;border:1.5px solid currentColor;opacity:.85}
.adm-tab svg{width:15px;height:15px}
.icon-btn{background:transparent;border:1.5px solid currentColor;border-radius:999px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none;color:inherit}
.icon-btn svg{width:16px;height:16px}

.wrap{padding-block:28px 64px;display:flex;flex-direction:column;gap:16px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:4px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mark)}
h1{font-size:30px;font-weight:800;margin:2px 0 4px;letter-spacing:-.03em;text-wrap:balance}
h2{font-size:15px;font-weight:700;margin:0;letter-spacing:-.01em}
.sub{margin:0}
.note{color:var(--muted);font-size:12px;margin:2px 0 0}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:600;cursor:pointer}
.ghost:hover{border-color:var(--fg)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kpi{padding:18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi-top{display:flex;justify-content:space-between;align-items:center;font-weight:600;color:var(--muted)}
.kpi-val{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.2}
.kpi-foot{color:var(--muted);font-size:12px}
.kpi.money{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink)}
.kpi.money .kpi-top,.kpi.money .kpi-foot{color:var(--yellow-ink);opacity:.75}
.kpi.pending{border-style:dashed;background:transparent}
.kpi.pending .kpi-val{color:var(--faint)}
.badge{font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted);white-space:nowrap}
.kpi.money .badge{border-color:rgba(0,0,0,.25);color:var(--yellow-ink)}

.potes4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi-top .dot{width:10px;height:10px;border-radius:50%;border:1px solid var(--line)}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.strip > div{padding:14px 18px;min-width:0}
.strip > div + div{border-left:1px solid var(--line)}
.top3{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.top3 span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top3 .num{font-size:15px;color:var(--muted)}
.strip .lbl{color:var(--muted);font-size:12px}
.strip .val{font-size:20px;font-weight:700;letter-spacing:-.02em}
.strip .ft{color:var(--muted);font-size:11px}

.panel-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.panel-head .meta{color:var(--muted);font-size:12px}
.panel-body{padding:14px 18px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}

.bars{display:flex;flex-direction:column;gap:5px}
.bar-row{display:grid;grid-template-columns:22px minmax(80px,120px) minmax(0,1fr) 44px;align-items:center;gap:10px;background:none;border:0;padding:3px 0;text-align:left;cursor:pointer}
.bar-row:hover .bar-name{text-decoration:underline}
.bar-pos{color:var(--faint);font-size:12px}
.bar-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.bar-track{height:12px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar-track i{display:block;height:100%;border-radius:3px;background:var(--s4)}
.bar-track i.hi{background:var(--yellow)}
.bar-val{text-align:right;font-weight:600}

.donut-wrap{display:grid;grid-template-columns:180px minmax(0,1fr);gap:20px;align-items:center}
.donut{width:180px;height:180px;max-width:100%}
.legend{display:flex;flex-direction:column;gap:7px}
.leg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.leg .num{color:var(--muted);font-size:12px;text-align:right}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding:14px 18px;border-bottom:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:180px}
.field label{font-size:12px;color:var(--muted)}
.field input{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;width:100%}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
.wide{min-width:760px}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--fg)}
th .arr{opacity:.5;margin-left:4px}
td{padding:10px 12px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
tr.total td{border-top:1px solid var(--line);font-weight:700}
.group-row td{background:var(--surface-2);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 12px}
.name-cell{font-weight:600}
.medal{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 4px;border-radius:999px;font-weight:600;font-size:12px;border:1px solid var(--line);color:var(--muted)}
.medal.m1{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink)}
.medal.m2{border-color:var(--fg);color:var(--fg)}
.medal.m3{border-color:var(--s3);color:var(--fg)}
.delta{font-size:11px;font-weight:600}
.up{color:var(--pos)} .down{color:var(--neg)} .same{color:var(--faint)}
.btn-sm{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:600;cursor:pointer;font-size:12px}
.btn-sm:hover{border-color:var(--fg)}

/* mapa de pontos */
.heat td,.heat th{padding:6px 4px;text-align:center;font-size:12px}
.heat th.n,.heat td.n{text-align:left;padding-left:12px;position:sticky;left:0;background:var(--surface);z-index:1}
.heat td.cell{min-width:36px}
.heat td.cell span{display:block;border-radius:5px;padding:3px 0;font-family:var(--font-num)}
.heat td.cell span.off{color:var(--faint)}
.heat td.tot{font-weight:700;padding-right:12px}

.etapas{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.etapa{padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.etapa-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.etapa-h b{font-size:15px}
.etapa-h span{color:var(--muted);font-size:12px}
.podium{display:flex;flex-direction:column;gap:6px}
.podium div{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center}
.podium .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.etapa-f{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.tag.y{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink);font-weight:600}

svg text{font-family:var(--font-num);font-size:11px;fill:var(--muted)}
.chart{width:100%;height:auto;display:block}

.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.rules p,.rules li{color:var(--muted)}
.rules ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
code{font-family:var(--font-num);font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--fg)}
pre{font-family:var(--font-num);font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;margin:8px 0 0;color:var(--fg)}

.overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;justify-content:flex-end}
.drawer{width:min(560px,100%);height:100%;background:var(--bg);overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) 20px;display:flex;flex-direction:column;gap:16px}
.drawer-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.drawer .icon-btn{color:var(--fg)}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mini .lbl{font-size:11px;color:var(--muted)}
.mini .val{font-size:18px;font-weight:700}

/* admin */
.adm-banner{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px}
.adm-banner.on{border-color:var(--yellow);box-shadow:inset 4px 0 0 var(--yellow)}
.adm-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.adm-form{display:flex;flex-direction:column;gap:12px}
.adm-row{display:flex;flex-wrap:wrap;gap:10px}
.adm-row .field.small{flex:0 1 200px;min-width:150px}
.field select,.adm-form textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:100%;font:inherit;color:inherit}
.adm-form textarea{font-family:var(--font-num);font-size:12px;resize:vertical}
.field input[type=date]{border-radius:10px}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.pl{display:grid;grid-template-columns:minmax(0,1fr) 64px 52px;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--surface)}
.pl.on{border-color:var(--fg);background:color-mix(in srgb,var(--yellow) 14%,var(--surface))}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;min-width:0}
.chk span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.chk input{accent-color:var(--fg);width:16px;height:16px;flex:none}
.pl .pos{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:4px 6px;text-align:center}
.pl .pos:disabled{opacity:.35}
.pl .pts{font-size:12px;color:var(--muted);text-align:right}
.adm-sum{margin:0}
.adm-err{margin:4px 0 0;padding-left:18px;color:var(--neg);font-size:13px}
.adm-ok{color:var(--pos);font-size:13px;margin:4px 0 0;font-weight:500}
.ghost.primary{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink)}
.btn-sm.danger,.x.danger{border-color:var(--neg);color:var(--neg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 12px;font-size:13px;background:var(--surface-2)}
.chip small{color:var(--muted);font-family:var(--font-num);padding-right:6px}
.x{background:none;border:1px solid transparent;border-radius:999px;cursor:pointer;color:var(--muted);padding:0 7px;font-size:13px}
.x:hover{color:var(--neg)}
.linkbtn{background:none;border:0;padding:0;color:inherit;text-decoration:underline;cursor:pointer;font-size:inherit}
.podio3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.podio-card{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:18px;text-align:left;cursor:pointer;font:inherit;color:inherit;min-width:0}
.podio-card:hover{border-color:var(--fg)}
.podio-pos{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.podio-nome{font-size:24px;font-weight:700;letter-spacing:-.02em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podio-pts{color:var(--muted);font-size:13px}
.podio-premio{margin-top:12px;display:flex;flex-direction:column}
.podio-premio small{font-size:11px;color:var(--muted)}
.podio-premio b{font-size:26px;letter-spacing:-.02em}
.podio-card.p1{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink)}
.podio-card.p1 .podio-pos,.podio-card.p1 .podio-pts,.podio-card.p1 small{color:var(--yellow-ink);opacity:.7}
@media (max-width:700px){ .podio3{grid-template-columns:minmax(0,1fr)} }
.card.editando{border-color:var(--yellow);box-shadow:inset 4px 0 0 var(--yellow)}
.login{max-width:380px;margin:48px auto 0;padding:24px;display:flex;flex-direction:column;gap:14px}
/* cards limpos: sem legendas */
.kpi-foot,.kpi .badge,.strip .ft{display:none}
footer{color:var(--faint);font-size:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding-top:8px}
.suits b{color:var(--fg)} .suits em{color:var(--red);font-style:normal}

@media (max-width:900px){
  .grid-3,.split{grid-template-columns:minmax(0,1fr)}
  .potes4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .strip > div:nth-child(3){border-left:0}
  .strip > div:nth-child(n+3){border-top:1px solid var(--line)}
}
@media (max-width:560px){
  .donut-wrap{grid-template-columns:minmax(0,1fr);justify-items:center}
  .legend{width:100%}
  .wm{font-size:21px}
  .adm-tab span{display:none}
  .adm-tab{padding:7px 9px}
  .top-in{gap:12px}
  .kpi-val{font-size:28px}
  .mini{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:no-preference){ .bar-track i{transition:width .5s ease} }
</style>

<header class="top">
  <div class="top-in">
    <button class="wm" id="logoBtn" aria-label="limper's club, voltar para o Painel">limper’s<i></i>club</button>
    <nav class="tabs" role="tablist" aria-label="Seções">
      <button class="tab" role="tab" data-tab="painel" id="t-painel">Painel</button>
      <button class="tab" role="tab" data-tab="ranking" id="t-ranking">Ranking</button>
      <button class="tab" role="tab" data-tab="etapas" id="t-etapas">Etapas</button>
      <button class="tab" role="tab" data-tab="cash" id="t-cash">Cash</button>
      <button class="tab" role="tab" data-tab="caixa" id="t-caixa">Caixa</button>
    </nav>
    <button class="tab adm-tab" data-tab="admin" id="t-admin" aria-label="Área do admin">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <span>Admin</span>
    </button>
    <button class="icon-btn" id="themeBtn" aria-label="Alternar tema claro ou escuro">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <div id="app"></div>
  <footer><span class="suits"><b>♠</b> <em>♥</em> <b>♣</b> <em>♦</em> &nbsp;limper’s club</span><span id="upd"></span></footer>
</main>

<script>
/* =====================================================================
   DADOS DO CLUBE — edite só este bloco. Ranking e caixa são calculados.
   Importado da planilha "Limpers Club - Poker.xlsx" (abas Ranking e Caixa).
   Etapa nova (pontos calculados sozinhos):
     { data, acordo: ["A","B","C"], ordem: ["D","E",...] }
     acordo = quem dividiu o prêmio (todos levam os pontos da posição N);
     sem acordo, o primeiro de "ordem" é quem ganhou sozinho.
   Etapas antigas vêm da planilha como { data, pontos: { Nome: pontos } }.
   ===================================================================== */
const CLUBE = {
  inicioTemporada: "2025-11-23",
  senhaAdmin: "limpers2026", // troque antes de publicar; abre a área do admin em .../#admin
  atualizadoEm: "2026-10-28",

  // tabela da planilha (aba Ranking, A53:B70)
  pontosPorPosicao: [90, 75, 60, 40, 30, 10, 10, 10, 10, 10],
  pontosDemais: 5,

  jogadores: ["Ale", "Arruda", "Braum", "Castro", "Codak", "Felipe P.", "Gabriel", "Gezes", "Japa", "Lorenzo", "Mathz",
    "Muniz", "Pasqual", "Pavani", "Pedrão", "Rafields", "Romasi", "Ryan", "Samugim", "Teng", "VT", "Vtzinho"],

/* ===================== cálculo ===================== */
const sum = a => a.reduce((s, v) => s + v, 0);
let entradas = [], saidas = [];

const ptsPos = i => CLUBE.pontosPorPosicao[i] ?? CLUBE.pontosDemais;

// Acordo entre N: todos levam os pontos da Nª posição; o resto segue a partir da posição N+1.
function pontosPelaRegra(acordo, ordem) {
  const out = {}, N = acordo.length;
  acordo.forEach(nome => out[nome] = ptsPos(N - 1));
  ordem.forEach((nome, i) => out[nome] = ptsPos(N + i));
  return out;
}

function lerEtapa(e) {
  // etapa lançada pelo admin: cada um na sua posição; quem fez acordo de N fica no Nº lugar
  if (e.posicoes) {
    const membros = e.acordo || [], N = membros.length + (e.fora || 0);
    const pos = { ...e.posicoes };
    membros.forEach(n => pos[n] = N);
    const pontos = {};
    Object.entries(pos).forEach(([n, p]) => pontos[n] = membros.includes(n) ? ptsPos(N - 1) : ptsPos(p - 1));
    return { pontos, pos, membros: new Set(membros), acordo: N > 1 ? N : 0, convidados: e.fora || 0, confere: [] };
  }
  // etapa da planilha: a pontuação mais alta diz o tamanho do acordo (75 = 2, 60 = 3, 40 = 4...).
  // Se há menos gente no ranking do que o acordo, o resto foi jogador de fora do ranking.
  const vals = Object.values(e.pontos), max = Math.max(...vals);
  const topo = vals.filter(p => p === max).length;
  const N = Math.max(topo, CLUBE.pontosPorPosicao.indexOf(max) + 1);
  const membros = new Set(N > 1 ? Object.keys(e.pontos).filter(n => e.pontos[n] === max) : []);
  return { pontos: e.pontos, membros, acordo: N > 1 ? N : 0, convidados: N > 1 ? N - topo : 0, confere: [] };
}

function calcular(n = CLUBE.etapas.length) {
  const st = {};
  const etapas = CLUBE.etapas.slice(0, n).map((e, idx) => {
    const L = lerEtapa(e);
    const res = Object.entries(L.pontos).map(([nome, pts]) => ({ nome, pts, regra: pts, acordo: L.membros.has(nome) }));
    // etapas antigas: a posição sai dos pontos (90 = 1º, 75 = 2º... 10 = 6º, 5 = 11º) e quem fez acordo fica em 1º
    res.sort((a, b) => b.pts - a.pts || a.nome.localeCompare(b.nome)).forEach((r, i) => {
      if (L.pos) { r.pos = L.pos[r.nome]; return; }
      const t = CLUBE.pontosPorPosicao.indexOf(r.pts);
      r.pos = r.acordo ? 1
        : t >= 0 ? t + 1
        : r.pts === CLUBE.pontosDemais ? CLUBE.pontosPorPosicao.length + 1
        : i && r.pts === res[i - 1].pts ? res[i - 1].pos : i + 1;
    });
    res.sort((a, b) => a.pos - b.pos || a.nome.localeCompare(b.nome));
    // a etapa é só o torneio: o cash do mesmo dia fica na aba Cash
    // (antes da quitação o valor da noite era um só, torneio e cash juntos)
    const doDia = entradas.filter(x => x.data === e.data && tipoEntrada(x.descricao) !== "cash");
    const arrec = sum(doDia.map(x => x.valor));
    const misto = doDia.some(x => tipoEntrada(x.descricao) === "misto");
    const tipo = e.nome || "Torneio";
    res.forEach(r => {
      const s = st[r.nome] ||= { nome: r.nome, pts: 0, etapas: 0, vitorias: 0, acordos: 0, podios: 0, melhor: null, hist: [] };
      s.pts += r.pts; s.etapas++;
      if (r.acordo) s.acordos++; else if (r.pos === 1) s.vitorias++;
      if (r.pos <= 3) s.podios++;
      if (s.melhor === null || r.pos < s.melhor) s.melhor = r.pos;
      s.hist.push({ etapa: idx + 1, data: e.data, pos: r.pos, field: res.length, pts: r.pts, acordo: r.acordo ? L.acordo : 0 });
    });
    return { ...e, num: idx + 1, res, arrec, misto, tipo, acordo: L.acordo, convidados: L.convidados || 0, confere: L.confere };
  });
  const ranking = Object.values(st).sort((a, b) => b.pts - a.pts || b.vitorias - a.vitorias || b.acordos - a.acordos || b.podios - a.podios || a.nome.localeCompare(b.nome));
  ranking.forEach((s, i) => s.rank = i && s.pts === ranking[i - 1].pts ? ranking[i - 1].rank : i + 1);
  return { st, ranking, etapas };
}

const POTES = ["caixa", "ranking", "jackpot", "organizacao"];
const POTES_PUB = ["caixa", "ranking", "jackpot"]; // organização só aparece no admin
const NOME_POTE = { caixa: "Caixa", ranking: "Premiação Rank do Torneio", jackpot: "Jackpot do Cash", organizacao: "Organização" };
const COR_POTE = { caixa: "var(--yellow)", ranking: "var(--s1)", jackpot: "var(--red)", organizacao: "var(--s4)" };
const r2 = v => Math.round(v * 100) / 100;
const tipoEntrada = d => /cash/i.test(d) && !/torneio/i.test(d) ? "cash" : /torneio/i.test(d) && !/cash/i.test(d) ? "torneio" : "misto";

// Livro-caixa: cada movimento diz quanto foi para cada pote
function calcularCaixa() {
  const MOV = [
    ...entradas.map(x => ({ ...x, t: "e" })),
    ...saidas.map(x => ({ ...x, t: "s", pote: "caixa" })),
    ...CLUBE.retiradas.map(([data, pote, descricao, valor]) => ({ data, pote, descricao, valor, t: "r" }))
  ].sort((a, b) => a.data.localeCompare(b.data) || "esr".indexOf(a.t) - "esr".indexOf(b.t));
  const caixa = { entradas: 0, saidas: 0, aposQuitacao: 0, torneio: 0, cash: 0, sobraQuitacao: 0, potes: { caixa: 0, ranking: 0, jackpot: 0, organizacao: 0 } };
  let saldo = 0, quitado = false;
  MOV.forEach(m => {
    if (!quitado && m.data > CLUBE.quitacao) {
      // o que sobrou depois de quitar a dívida também é dividido entre os potes
      quitado = true; caixa.sobraQuitacao = caixa.potes.caixa; caixa.potes.caixa = 0; caixa.sobraParts = {};
      Object.entries(CLUBE.divisaoSobra).forEach(([p, f]) => { caixa.sobraParts[p] = r2(caixa.sobraQuitacao * f); caixa.potes[p] = r2(caixa.potes[p] + caixa.sobraParts[p]); });
    }
    m.fase = quitado ? "divisao" : "quitacao";
    m.parts = {};
    if (m.t === "e") {
      caixa.entradas += m.valor;
      const tp = tipoEntrada(m.descricao);
      if (quitado && tp !== "misto") {
        caixa.aposQuitacao += m.valor; caixa[tp] += m.valor;
        Object.entries(CLUBE.divisao[tp]).forEach(([p, f]) => m.parts[p] = r2(m.valor * f));
      } else m.parts.caixa = m.valor;
    } else {
      if (m.t === "s") caixa.saidas += m.valor;
      m.parts[m.pote] = -m.valor;
    }
    Object.entries(m.parts).forEach(([p, v]) => caixa.potes[p] = r2(caixa.potes[p] + v));
    saldo += m.t === "e" ? m.valor : -m.valor; m.saldo = r2(saldo);
    m.saldoPub = r2(saldo - caixa.potes.organizacao); // o que o público vê (sem a organização)
  });
  caixa.saldo = r2(saldo);
  caixa.saldoPub = r2(saldo - caixa.potes.organizacao);
  return { MOV, caixa };
}

let MOV, caixa, D, PREV, prevRank;
function recalcular() {
  entradas = CLUBE.entradas.map(([data, descricao, valor]) => ({ data, descricao, valor }));
  saidas = CLUBE.saidas.map(([data, descricao, valor]) => ({ data, descricao, valor }));
  ({ MOV, caixa } = calcularCaixa());
  D = calcular();
  PREV = calcular(CLUBE.etapas.length - 1);
  prevRank = Object.fromEntries(PREV.ranking.map(s => [s.nome, s.rank]));
}

function donut(segs, center, sub) {
  const R = 70, C = 2 * Math.PI * R, tot = sum(segs.map(s => s.v));
  let off = 0;
  const arcs = segs.map(s => {
    const len = s.v / tot * C;
    const a = `<circle cx="90" cy="90" r="${R}" fill="none" stroke="${s.col}" stroke-width="26" stroke-dasharray="${Math.max(0, len - 1.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)"><title>${esc(s.lbl)}: ${brl(s.v)}</title></circle>`;
    off += len; return a;
  }).join("");
  return `<svg class="donut" viewBox="0 0 180 180" role="img" aria-label="Divisão do dinheiro arrecadado">
    <circle cx="90" cy="90" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="26"/>${arcs}
    <text x="90" y="93" text-anchor="middle" style="font-size:16px;font-weight:600;fill:var(--fg)">${center}</text>
    <text x="90" y="110" text-anchor="middle" style="font-size:10px;font-family:var(--font-ui)">${sub}</text>
  </svg>`;
}

function drawRankTable() {
  const q = busca.trim().toLowerCase();
  const val = (s, k) => k === "media" ? s.pts / s.etapas : s[k];
  const rows = D.ranking.filter(s => !q || s.nome.toLowerCase().includes(q))
    .sort((a, b) => { const x = val(a, sortKey), y = val(b, sortKey); return (typeof x === "string" ? x.localeCompare(y) : x - y) * sortDir || a.rank - b.rank; });
  const grupo = s => s.rank <= 3 ? "Pódio" : s.rank <= 10 ? "Top 10" : "Demais";
  let last = null;
  const body = rows.map(s => {
    let g = "";
    if (sortKey === "rank" && !q && grupo(s) !== last) {
      last = grupo(s);
      g = `<tr class="group-row"><td colspan="11">${last} · ${rows.filter(r => grupo(r) === last).length}</td></tr>`;
    }
    return g + `<tr>
      <td class="c">${medal(s.rank)}</td><td class="c">${deltaHtml(s)}</td>
      <td class="name-cell">${esc(s.nome)}${premioRank(s.rank) ? ` <span class="tag y num">${brl(premioRank(s.rank))}</span>` : ""}</td>
      <td class="r num"><b>${s.pts}</b></td><td class="c num">${s.etapas}</td><td class="c num">${(s.pts / s.etapas).toFixed(1)}</td>
      <td class="c num">${s.vitorias}</td><td class="c num">${s.acordos}</td><td class="c num">${s.podios}</td><td class="c num">${s.melhor}º</td>
      <td class="r"><button class="btn-sm" data-ficha="${esc(s.nome)}">Ver ficha</button></td>
    </tr>`;
  }).join("");
  const th = c => `<th class="sort ${c.cls || ""}" data-sort="${c.k}">${c.t}<span class="arr">${sortKey === c.k ? (sortDir > 0 ? "↑" : "↓") : "⇅"}</span></th>`;
  document.getElementById("rankTbl").innerHTML = `<thead><tr>${th(COLS[0])}<th class="c">Δ</th>${COLS.slice(1).map(th).join("")}<th></th></tr></thead><tbody>${body || `<tr><td colspan="10" style="color:var(--muted)">Ninguém encontrado com “${esc(busca)}”.</td></tr>`}</tbody>`;
}

function heatmap() {
  const head = D.etapas.map(e => `<th class="num" title="${dt(e.data)}">${dtShort(e.data)}</th>`).join("");
  const rows = D.ranking.map(s => {
    const by = Object.fromEntries(s.hist.map(h => [h.etapa, h.pts]));
    const cells = D.etapas.map(e => {
      const p = by[e.num];
      if (p === undefined) return `<td class="cell"><span class="off">·</span></td>`;
      const a = Math.round(12 + p / MAXPTS * 88);
      const ink = a > 55 ? "color:var(--yellow-ink);font-weight:600" : "";
      return `<td class="cell"><span style="background:color-mix(in srgb,var(--yellow) ${a}%,var(--surface));${ink}">${p}</span></td>`;
    }).join("");
    return `<tr><td class="n name-cell">${esc(s.nome)}</td>${cells}<td class="tot num r">${s.pts}</td></tr>`;
  }).join("");
  return `<table class="heat" style="min-width:${180 + D.etapas.length * 40}px"><thead><tr><th class="n">Jogador</th>${head}<th class="r" style="padding-right:12px">Total</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function niceStep(max) { return [100, 250, 500, 1000, 2000, 2500, 5000].find(x => max / x <= 5) || 10000; }

function graficoMensal(mov) {
  const first = mov[0].data.slice(0, 7), lastM = mov[mov.length - 1].data.slice(0, 7);
  const meses = [];
  for (let [y, m] = first.split("-").map(Number); `${y}-${String(m).padStart(2, "0")}` <= lastM; m === 12 ? (y++, m = 1) : m++) meses.push(`${y}-${String(m).padStart(2, "0")}`);
  let acc = 0;
  const M = meses.map(k => {
    const doMes = mov.filter(x => x.data.startsWith(k));
    const e = sum(doMes.filter(x => x.t === "e").map(x => x.valor));
    const s = sum(doMes.filter(x => x.t !== "e" && x.pote !== "organizacao").map(x => x.valor));
    if (doMes.length) acc = doMes[doMes.length - 1].saldoPub;
    return { k, e, s, acc };
  });
  const W = 900, H = 280, pl = 56, pr = 10, pt = 14, pb = 34;
  // entradas sobem a partir do zero, saídas descem (negativas)
  const hi = Math.max(...M.map(m => Math.max(m.e, m.acc))), lo = Math.min(0, ...M.map(m => Math.min(-m.s, m.acc)));
  const step = niceStep(hi - lo), max = Math.ceil(hi / step) * step, min = Math.floor(lo / step) * step;
  const iw = W - pl - pr, ih = H - pt - pb, slot = iw / M.length, bw = Math.min(22, slot * 0.5);
  const y = v => pt + (max - v) / (max - min) * ih;
  let g = "";
  for (let t = min; t <= max; t += step) g += `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" ${t ? 'stroke-dasharray="2 4"' : ""}/><text x="${pl - 8}" y="${y(t) + 4}" text-anchor="end">${t.toLocaleString("pt-BR")}</text>`;
  const bars = M.map((m, i) => {
    const cx = pl + slot * (i + .5);
    const [yy, mm] = m.k.split("-");
    return `<rect x="${cx - bw / 2}" y="${y(m.e)}" width="${bw}" height="${y(0) - y(m.e)}" fill="var(--yellow)" rx="2"><title>${MESES[mm - 1]}/${yy} · entradas ${brl(m.e)}</title></rect>
      <rect x="${cx - bw / 2}" y="${y(0)}" width="${bw}" height="${y(-m.s) - y(0)}" fill="var(--red)" rx="2"><title>${MESES[mm - 1]}/${yy} · saídas −${brl(m.s)}</title></rect>
      ${i % 2 === 0 || M.length < 13 ? `<text x="${cx}" y="${H - 18}" text-anchor="middle">${MESES[mm - 1]}</text>` : ""}
      ${mm === "01" || i === 0 ? `<text x="${cx}" y="${H - 4}" text-anchor="middle" style="fill:var(--faint)">${yy}</text>` : ""}`;
  }).join("");
  const line = M.map((m, i) => `${pl + slot * (i + .5)},${y(m.acc)}`).join(" ");
  const L = M[M.length - 1], lx = pl + slot * (M.length - .5);
  return `<div class="tbl-wrap"><svg class="chart" style="min-width:640px" viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas, saídas e saldo por mês">${g}${bars}
    <polyline points="${line}" fill="none" stroke="var(--s1)" stroke-width="2"/>
    ${M.map((m, i) => `<circle cx="${pl + slot * (i + .5)}" cy="${y(m.acc)}" r="${i === M.length - 1 ? 4.5 : 2.2}" fill="${i === M.length - 1 ? "var(--s1)" : "var(--surface)"}" stroke="var(--s1)" stroke-width="1.5"><title>saldo ${brl(m.acc)}</title></circle>`).join("")}
    <text x="${lx - 8}" y="${y(L.acc) - 10}" text-anchor="end" style="fill:var(--fg);font-weight:600">${brl(L.acc)}</text>
  </svg></div>`;
}

const hoje = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
// editIdx: índice da etapa sendo editada (null = etapa nova); modo "pts" = etapa antiga da planilha, editada direto nos pontos
const novoRascunho = () => ({ data: hoje(), nome: "", jogou: {}, pos: {}, fora: 0, torneio: "", cash: "", editIdx: null, modo: "pos" });
let rascunho = novoRascunho(), apagar = null, avisoAdm = "";

const torneioDoDia = data => CLUBE.entradas.filter(x => x[0] === data && tipoEntrada(x[1]) !== "cash");

function editarEtapa(i) {
  const e = CLUBE.etapas[i], ev = D.etapas[i];
  rascunho = novoRascunho();
  Object.assign(rascunho, { data: e.data, nome: e.nome || "", editIdx: i, dataOrig: e.data, modo: e.posicoes ? "pos" : "pts", fora: e.fora || 0 });
  ev.res.forEach(r => { rascunho.jogou[r.nome] = true; rascunho.pos[r.nome] = e.posicoes ? (r.acordo ? 1 : r.pos) : r.pts; });
  const t = sum(torneioDoDia(e.data).map(x => x[2]));
  rascunho.torneio = t ? String(t) : ""; rascunho.torneioOrig = rascunho.torneio;
  renderAdmin();
  document.getElementById("lancar").scrollIntoView({ behavior: "smooth" });
}

function pontosRascunho() {
  const nomes = CLUBE.jogadores.filter(n => rascunho.jogou[n]);
  if (rascunho.modo === "pts") {
    const out = {}, erros = [];
    if (!rascunho.data) erros.push("Escolha a data da etapa.");
    if (nomes.length < 2) erros.push("Marque pelo menos dois jogadores.");
    nomes.forEach(n => { const p = parseInt(rascunho.pos[n], 10); if (!(p > 0)) erros.push(`Falta a pontuação de ${n}.`); else out[n] = p; });
    return { out, erros, N: 0, acordo: 0, nomes, membros: [], posicoes: {} };
  }
  const pos = n => parseInt(rascunho.pos[n], 10) || 0;
  const acordo = nomes.filter(n => pos(n) === 1).length;
  const N = acordo + (parseInt(rascunho.fora, 10) || 0);
  const out = {}, erros = [];
  if (!rascunho.data) erros.push("Escolha a data da etapa.");
  if (nomes.length < 2) erros.push("Marque pelo menos dois jogadores.");
  else if (!acordo) erros.push("Coloque 1 na posição de quem ganhou (ou de todos que entraram no acordo).");
  const vistos = {};
  nomes.forEach(n => {
    const p = pos(n);
    if (!p) { erros.push(`Falta a posição de ${n}.`); return; }
    if (p > 1 && p <= N) erros.push(`${n} está em ${p}º, mas o acordo ocupa até o ${N}º lugar.`);
    if (p > 1 && vistos[p]) erros.push(`${p}º lugar repetido (${vistos[p]} e ${n}).`);
    vistos[p] = n;
    out[n] = p === 1 ? ptsPos(N - 1) : ptsPos(p - 1);
  });
  const membros = N > 1 ? nomes.filter(n => pos(n) === 1) : [];
  const posicoes = Object.fromEntries(nomes.filter(n => !membros.includes(n)).map(n => [n, pos(n)]));
  return { out, erros, N, acordo, nomes, membros, posicoes };
}

function resumoRascunho(R) {
  if (!R.nomes.length) return `<p class="note">Nenhum jogador marcado ainda.</p>`;
  return `<p class="adm-sum"><b>${R.nomes.length} jogadores</b>${R.acordo ? ` · ${R.N > 1 ? `acordo em ${R.N}, ${ptsPos(R.N - 1)} pts cada` : `vencedor leva ${ptsPos(0)} pts`}` : ""}</p>
    ${R.erros.length ? `<ul class="adm-err">${R.erros.map(e => `<li>${esc(e)}</li>`).join("")}</ul>` : `<p class="adm-ok">Pronto para salvar.</p>`}`;
}

function movAdmin() {
  const L = [];
  CLUBE.entradas.forEach((x, i) => L.push({ key: "n" + i, data: x[0], desc: x[1], pote: tipoEntrada(x[1]) === "cash" ? "entrada cash" : "entrada torneio", valor: x[2], sinal: 1 }));
  CLUBE.saidas.forEach((x, i) => L.push({ key: "s" + i, data: x[0], desc: x[1], pote: "caixa", valor: x[2], sinal: -1 }));
  CLUBE.retiradas.forEach((x, i) => L.push({ key: "r" + i, data: x[0], desc: x[2], pote: NOME_POTE[x[1]] || x[1], valor: x[3], sinal: -1 }));
  return L.sort((a, b) => b.data.localeCompare(a.data));
}

function acaoAdmin(acao) {
  const val = id => document.getElementById(id).value.trim();
  if (acao === "entrar") {
    if (val("adm-senha") === CLUBE.senhaAdmin) { adminOk = true; try { sessionStorage.setItem("limpers-adm", "1"); } catch (e) {} return renderAdmin(); }
    avisoAdm = "Senha incorreta."; return renderLogin();
  }
  if (acao === "sair") { adminOk = false; try { sessionStorage.removeItem("limpers-adm"); } catch (e) {} return go("painel"); }
  if (acao === "irExportar") return document.getElementById("exportar").scrollIntoView({ behavior: "smooth" });
  if (acao === "salvarEtapa") {
    const R = pontosRascunho();
    if (R.erros.length) { document.getElementById("r-resumo").innerHTML = resumoRascunho(R); return; }
    const e = rascunho.modo === "pts"
      ? { data: rascunho.data, pontos: R.out }
      : { data: rascunho.data, acordo: R.membros, fora: R.membros.length ? parseInt(rascunho.fora, 10) || 0 : 0, posicoes: R.posicoes, pontos: R.out };
    if (rascunho.nome.trim()) e.nome = rascunho.nome.trim();
    const editando = rascunho.editIdx !== null;
    const t = parseFloat(rascunho.torneio) || 0;
    // a descrição precisa ter "Torneio" para a divisão 40/30/30 reconhecer a entrada
    let desc = e.nome && /torneio/i.test(e.nome) && !/cash/i.test(e.nome) ? e.nome : "Torneio";
    if (editando) {
      CLUBE.etapas[rascunho.editIdx] = e;
      // só mexe no dinheiro do torneio se a data ou o valor mudaram
      if (rascunho.data !== rascunho.dataOrig || String(rascunho.torneio) !== String(rascunho.torneioOrig)) {
        const antigas = torneioDoDia(rascunho.dataOrig);
        if (antigas.length === 1) desc = antigas[0][1]; // mantém "Torneio e Cash" das noites antigas
        CLUBE.entradas = CLUBE.entradas.filter(x => !antigas.includes(x));
        if (t > 0) CLUBE.entradas.push([rascunho.data, desc, t]);
      }
      avisoAdm = `Etapa de ${dt(rascunho.data)} atualizada.`;
    } else {
      CLUBE.etapas.push(e);
      if (t > 0) CLUBE.entradas.push([rascunho.data, desc, t]);
      avisoAdm = `Etapa de ${dt(rascunho.data)} salva com ${R.nomes.length} jogadores.`;
    }
    rascunho = novoRascunho();
  } else if (acao === "addCash") {
    const data = val("c-data"), v = parseFloat(val("c-valor"));
    if (!data || !(v > 0)) { avisoAdm = "Preencha a data e um valor de cash maior que zero."; return renderAdmin(); }
    CLUBE.entradas.push([data, "Cash", v]);
    avisoAdm = `Cash de ${dt(data)} salvo: ${brl(v)}.`;
  } else if (acao === "limparEtapa") {
    rascunho = novoRascunho();
  } else if (acao === "addJog") {
    const n = val("novoJog");
    if (!n) return;
    if (CLUBE.jogadores.some(j => j.toLowerCase() === n.toLowerCase())) { avisoAdm = `${n} já está cadastrado.`; return renderAdmin(); }
    CLUBE.jogadores.push(n); avisoAdm = `${n} cadastrado.`;
  } else if (acao === "addMov") {
    const [t, k] = val("m-tipo").split(":"), data = val("m-data"), v = parseFloat(val("m-valor")), desc = val("m-desc");
    if (!data || !(v > 0)) { avisoAdm = "Preencha a data e um valor maior que zero."; return renderAdmin(); }
    if (t === "e") CLUBE.entradas.push([data, k, v]);
    else if (k === "caixa") CLUBE.saidas.push([data, desc || "Compra de material", v]);
    else CLUBE.retiradas.push([data, k, desc || NOME_POTE[k], v]);
    avisoAdm = `Registrado: ${brl(v)} em ${dt(data)}.`;
  } else if (acao === "copiar") {
    const ta = document.getElementById("expTxt");
    const ok = () => { avisoAdm = "Dados copiados."; renderAdmin(); };
    if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(ok, () => { ta.focus(); ta.select(); });
    else { ta.focus(); ta.select(); }
    return;
  } else if (acao === "importar") {
    try { const obj = JSON.parse(val("impTxt")); if (!Array.isArray(obj.etapas)) throw 0; aplicarDados(obj); avisoAdm = "Dados carregados."; }
    catch (e) { avisoAdm = "Não consegui ler esses dados. Cole o texto completo copiado em “Exportar dados”."; return renderAdmin(); }
  }
  salvarDados(); renderAdmin();
}

function apagarAdmin(k) {
  if (apagar !== k) { apagar = k; return renderAdmin(); }
  apagar = null;
  const i = +k.slice(1);
  if (k === "tudo") { try { localStorage.removeItem(CHAVE); } catch (e) {} aplicarDados(JSON.parse(ORIGINAL)); recalcular(); avisoAdm = "Alterações descartadas."; return renderAdmin(); }
  if (k[0] === "e") { CLUBE.etapas.splice(i, 1); rascunho = novoRascunho(); }
  if (k[0] === "j") CLUBE.jogadores.splice(i, 1);
  if (k[0] === "n") CLUBE.entradas.splice(i, 1);
  if (k[0] === "s") CLUBE.saidas.splice(i, 1);
  if (k[0] === "r") CLUBE.retiradas.splice(i, 1);
  avisoAdm = "Excluído.";
  salvarDados(); renderAdmin();
}

  if (!t.checked) delete rascunho.pos[n];
  const y = window.scrollY; renderAdmin(); window.scrollTo(0, y);
  if (t.checked) { const p = app.querySelector(`[data-pos="${t.dataset.jogou}"]`); if (p) p.focus({ preventScroll: true }); }
});

/* ===================== navegação ===================== */
const RENDER = { painel: renderPainel, ranking: renderRanking, etapas: renderEtapas, cash: renderCash, caixa: renderCaixa, admin: () => adminLiberado() ? renderAdmin() : renderLogin() };
function go(tab, push = true) {
  if (!RENDER[tab]) tab = "painel";
  apagar = null;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  RENDER[tab]();
  // o Painel fica no endereço principal; as outras abas ganham #nome para dar para mandar o link direto
  if (push) try { history.replaceState(null, "", tab === "painel" ? location.pathname + location.search : "#" + tab); } catch (e) {}
  window.scrollTo(0, 0);
}
document.querySelector(".tabs").addEventListener("click", e => { const b = e.target.closest(".tab"); if (b) go(b.dataset.tab); });
app.addEventListener("click", e => {
  const ac = e.target.closest("[data-acao]"); if (ac) return acaoAdmin(ac.dataset.acao);
  const dl = e.target.closest("[data-del]"); if (dl) return apagarAdmin(dl.dataset.del);
  const ed = e.target.closest("[data-edit]"); if (ed) return editarEtapa(+ed.dataset.edit);
  const f = e.target.closest("[data-ficha]"); if (f) return abrirFicha(f.dataset.ficha);
  const g = e.target.closest("[data-go]"); if (g) return go(g.dataset.go);
  const s = e.target.closest("[data-sort]");
  if (s) { const k = s.dataset.sort; if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = ["nome", "rank", "melhor"].includes(k) ? 1 : -1; } return drawRankTable(); }
  const et = e.target.closest("[data-etapa]");
  if (et) {
    const ev = D.etapas[+et.dataset.etapa - 1], box = document.getElementById("etapaDet");
    box.innerHTML = `<div class="panel-head"><h2>Etapa ${ev.num} · ${dt(ev.data)}</h2><span class="meta">${ev.res.length} jogadores${ev.arrec ? ` · ${ev.misto ? "Torneio e cash" : "Torneio"} ${brl(ev.arrec)}` : ""}</span></div><div class="tbl-wrap">${tabelaEtapa(ev)}</div>`;
    box.hidden = false; box.scrollIntoView({ behavior: "smooth", block: "start" });
  }
});

const root = document.documentElement;
try { const t = localStorage.getItem("limpers-tema"); if (t) root.dataset.theme = t; } catch (e) {}
document.getElementById("t-admin").addEventListener("click", () => go("admin"));
document.getElementById("logoBtn").addEventListener("click", () => go("painel"));
document.getElementById("themeBtn").addEventListener("click", () => {
  const atual = root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  root.dataset.theme = atual === "dark" ? "light" : "dark";
  try { localStorage.setItem("limpers-tema", root.dataset.theme); } catch (e) {}
});

window.addEventListener("hashchange", () => go(location.hash.slice(1), false));
go(location.hash.slice(1) || "painel", false);
</script>
